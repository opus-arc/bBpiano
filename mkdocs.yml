site_name: bBpiano · 研究
site_url: https://opus-arc.github.io/bBpiano/research/
docs_dir: doc/site/research
site_dir: site/research
use_directory_urls: false

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate

nav:
  - 研究概览: index.md
  - 从波动方程到物理建模: from-pde-to-pcm.md
  - 项目说明: project.md
  - 音频比较: audio.md

markdown_extensions:
  - toc:
      toc_depth: 2-4
      permalink: true

  - pymdownx.arithmatex:
      generic: true

  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
