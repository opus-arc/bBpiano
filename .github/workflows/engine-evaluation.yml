name: bBpiano Engine Evaluation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  performance:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build bBpiano Lite
        shell: bash
        run: |
          set -o pipefail

          xcodebuild build \
            -scheme "bBpiano Lite" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee engine-build.log

      - name: Run engine benchmark
        shell: bash
        run: |
          set -o pipefail

          BBPL_PATH="$PWD/build/Build/Products/Release/bbpl"

          if [ ! -x "$BBPL_PATH" ]; then
            echo "bbpl executable not found at: $BBPL_PATH"
            echo
            echo "Release products:"
            find "$PWD/build/Build/Products/Release" -maxdepth 4 -print || true
            exit 1
          fi

          echo "Using executable: $BBPL_PATH"

          "$BBPL_PATH" -b | tee engine-evaluation.log

      - name: Write engine evaluation summary
        shell: bash
        run: |
          {
            echo "# bBpiano Engine Evaluation"
            echo
            echo '```'
            cat engine-evaluation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload engine evaluation logs
        uses: actions/upload-artifact@v4
        with:
          name: engine-evaluation-logs
          path: |
            engine-build.log
            engine-evaluation.log
