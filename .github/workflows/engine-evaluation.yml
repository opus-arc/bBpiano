name: bBpiano Engine Evaluation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  performance:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Build bBpiano Lite
        shell: bash
        run: |
          set -o pipefail

          xcodebuild build \
            -scheme "bBpiano Lite" \
            -configuration Release \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee engine-build.log

      - name: Run engine benchmark
        shell: bash
        run: |
          set -o pipefail

          BBPL_PATH=$(find ~/Library/Developer/Xcode/DerivedData \
            -path "*/Build/Products/Release/*" \
            -type f \
            -perm -111 \
            -name "bBpiano Lite" \
            | head -n 1)

          if [ -z "$BBPL_PATH" ]; then
            echo "bBpiano Lite executable not found"
            exit 1
          fi

          echo "Using executable: $BBPL_PATH"

          "$BBPL_PATH" -b | tee engine-evaluation.log

      - name: Write engine evaluation summary
        shell: bash
        run: |
          {
            echo "# bBpiano Engine Evaluation"
            echo
            echo '```'
            cat engine-evaluation.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload engine evaluation logs
        uses: actions/upload-artifact@v4
        with:
          name: engine-evaluation-logs
          path: |
            engine-build.log
            engine-evaluation.log
