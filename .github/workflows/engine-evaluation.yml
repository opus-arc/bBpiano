name: bBpiano Engine Evaluation

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  performance:
    # The published L2-200c binary requires macOS 27 on Apple Silicon.
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      # Actions VMs are slower than the development Mac; allow 200% in CI.
      MAX_88_KEY_OCCUPANCY_PERCENT: "200.0"

    steps:
      - uses: actions/checkout@v4

      - name: Download the latest release binary
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" > release.json
          python3 - <<'PY'
          import json
          import os

          release = json.load(open("release.json", encoding="utf-8"))
          tag = release["tag_name"]
          assets = [a for a in release["assets"]
                    if a["name"].startswith(f"bBpiano-{tag}-")
                    and a["name"].lower().endswith("-macos-arm64.zip")]
          if len(assets) != 1:
              raise SystemExit("Expected one macOS arm64 release archive")
          asset = assets[0]
          digest = asset.get("digest", "")
          if not digest.startswith("sha256:"):
              raise SystemExit("The release asset has no SHA-256 digest")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"BBPL_RELEASE_TAG={tag}\n")
              output.write(f"BBPL_ARCHIVE={asset['name']}\n")
              output.write(f"BBPL_SHA256={digest.removeprefix('sha256:')}\n")
          PY

      - name: Verify and extract the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$BBPL_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$BBPL_ARCHIVE" --dir release
          (cd release && printf '%s  %s\n' "$BBPL_SHA256" "$BBPL_ARCHIVE" | shasum -a 256 -c -)
          ditto -xk "release/$BBPL_ARCHIVE" release
          codesign --verify --strict release/bbpl
          codesign --verify --check-notarization -R='notarized' --verbose=2 release/bbpl
          release/bbpl -v | tee engine-version.log

      - name: Run bbpl -t
        shell: bash
        run: |
          set +e
          release/bbpl -t 2>&1 | tee engine-evaluation.log
          benchmark_exit=${PIPESTATUS[0]}
          set -e
          echo "BBPL_TEST_EXIT=$benchmark_exit" >> "$GITHUB_ENV"

      - name: Check the 200 percent occupancy limit
        run: |
          printf 'Evaluated release: %s\n\n' "$BBPL_RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/check-engine-benchmark.py engine-evaluation.log \
            --exit-code "$BBPL_TEST_EXIT" \
            --max-occupancy "$MAX_88_KEY_OCCUPANCY_PERCENT" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release.json
            engine-version.log
            engine-evaluation.log
