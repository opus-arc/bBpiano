name: bBpiano Engine Evaluation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  performance:
    runs-on: macos-26

    env:
      MAX_ALLOWED_OCCUPANCY_PERCENT: "130.0"

    steps:
      - uses: actions/checkout@v4

      - name: Build bBpiano Lite
        shell: bash
        run: |
          set -o pipefail

          xcodebuild build \
            -scheme "bBpiano Lite" \
            -configuration Release \
            -derivedDataPath "$PWD/build" \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee engine-build.log

      - name: Run engine benchmark
        shell: bash
        run: |
          set -o pipefail

          BBPL_PATH="$PWD/build/Build/Products/Release/bbpl"

          if [ ! -x "$BBPL_PATH" ]; then
            echo "bbpl executable not found at: $BBPL_PATH"
            echo
            echo "Release products:"
            find "$PWD/build/Build/Products/Release" -maxdepth 4 -print || true
            exit 1
          fi

          echo "Using executable: $BBPL_PATH"

          set +e
          "$BBPL_PATH" -b | tee engine-evaluation.log
          BENCHMARK_EXIT=${PIPESTATUS[0]}
          set -e

          echo "BENCHMARK_EXIT=$BENCHMARK_EXIT" >> "$GITHUB_ENV"

      - name: Write engine evaluation summary and enforce CI threshold
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          max_allowed = float(os.environ["MAX_ALLOWED_OCCUPANCY_PERCENT"])

          with open("engine-evaluation.log", "r", encoding="utf-8") as f:
              log = f.read()

          match = re.search(r"occupancy\s+([0-9]+(?:\.[0-9]+)?)%", log)
          if not match:
              print("Could not parse occupancy from engine-evaluation.log")
              sys.exit(1)

          occupancy = float(match.group(1))
          passed = occupancy <= max_allowed

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# bBpiano Engine Evaluation\n\n")
              f.write("```\n")
              f.write(log.rstrip())
              f.write("\n```\n\n")
              f.write(f"**CI maximum allowed engine occupancy:** {max_allowed:.2f}%\n\n")
              f.write(
                  "Note: GitHub Actions macOS runners are virtualized Apple Silicon machines; "
                  "CI results are for regression tracking, not absolute hardware benchmarking. "
                  f"The CI pass threshold is therefore set to {max_allowed:.2f}% occupancy.\n"
              )

          if not passed:
              print(f"Engine occupancy {occupancy:.2f}% exceeded CI limit {max_allowed:.2f}%")
              sys.exit(1)

          print(f"Engine occupancy {occupancy:.2f}% is within CI limit {max_allowed:.2f}%")
          PY

      - name: Upload engine evaluation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-evaluation-logs
          path: |
            engine-build.log
            engine-evaluation.log
