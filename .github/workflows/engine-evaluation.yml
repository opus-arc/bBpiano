name: bBpiano Engine Evaluation

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]

jobs:
  performance:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run engine performance tests
        run: |
          xcodebuild test \
            -scheme bBpiano \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            | tee engine-evaluation.log

      - name: Upload engine evaluation log
        uses: actions/upload-artifact@v4
        with:
          name: engine-evaluation-log
          path: engine-evaluation.log
