name: Update Homebrew Formula

on:
  release:
    types: [published, edited]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example L0-beta"
        required: true
        type: string

jobs:
  update-homebrew-formula:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'L')
    runs-on: ubuntu-latest

    steps:
      - name: Set release variables
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name')
          mapfile -t ZIP_MATCHES < <(printf '%s\n' "$ASSETS" | awk -v prefix="bBpiano-${TAG}-" 'index($0, prefix) == 1 && /-macOS-arm64\.zip$/')

          if [ "${#ZIP_MATCHES[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS arm64 asset for ${TAG}, found ${#ZIP_MATCHES[@]}" >&2
            exit 1
          fi

          ZIP="${ZIP_MATCHES[0]}"
          URL="https://github.com/opus-arc/bBpiano/releases/download/${TAG}/${ZIP}"

          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          echo "URL=${URL}" >> "$GITHUB_ENV"

      - name: Verify release asset exists
        run: |
          curl -fL --head "$URL"

      - name: Calculate SHA256
        run: |
          SHA256=$(curl -fL "$URL" | sha256sum | awk '{print $1}')
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: opus-arc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        working-directory: homebrew-tap
        run: |
          FORMULA="Formula/bBpiano-L.rb"

          sed -i "s|^  version .*|  version \"${TAG}\"|" "$FORMULA"
          sed -i "s|^  url .*|  url \"${URL}\"|" "$FORMULA"
          sed -i "s|^  sha256 .*|  sha256 \"${SHA256}\"|" "$FORMULA"

      - name: Commit and push Formula update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/bBpiano-L.rb

          if git diff --cached --quiet; then
            echo "Formula is already up to date."
            exit 0
          fi

          git commit -m "Update bBpiano-L formula for ${TAG}"
          git push
