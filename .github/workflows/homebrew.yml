name: Update Homebrew Formula

on:
  release:
    types: [published, edited]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example L0-beta"
        required: true
        type: string

concurrency:
  group: homebrew-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  update-homebrew-formula:
    if: startsWith(github.event.release.tag_name || inputs.tag, 'L')
    runs-on: ubuntu-latest

    steps:
      - name: Set release variables
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          ASSETS=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[].name')
          mapfile -t ZIP_MATCHES < <(printf '%s\n' "$ASSETS" | awk -v prefix="bBpiano-${TAG}-" 'index($0, prefix) == 1 && tolower($0) ~ /-macos-arm64\.zip$/')

          if [ "${#ZIP_MATCHES[@]}" -ne 1 ]; then
            echo "Expected exactly one macOS arm64 asset for ${TAG}, found ${#ZIP_MATCHES[@]}" >&2
            exit 1
          fi

          ZIP="${ZIP_MATCHES[0]}"
          URL="https://github.com/opus-arc/bBpiano/releases/download/${TAG}/${ZIP}"

          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          echo "URL=${URL}" >> "$GITHUB_ENV"

      - name: Verify release asset exists
        run: |
          curl -fL --head "$URL"

      - name: Calculate SHA256
        run: |
          set -euo pipefail
          SHA256=$(curl -fL "$URL" | sha256sum | awk '{print $1}')
          echo "SHA256=${SHA256}" >> "$GITHUB_ENV"
          # A replaced asset needs a distinct Homebrew download cache key.
          echo "URL=${URL}?sha256=${SHA256}" >> "$GITHUB_ENV"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: opus-arc/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Formula
        working-directory: homebrew-tap
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("Formula/bBpiano-L.rb")
          text = path.read_text()
          old_version = re.search(r'^  version "([^"]+)"$', text, re.M).group(1)
          old_sha = re.search(r'^  sha256 "([^"]+)"$', text, re.M).group(1)
          old_revision = re.search(r'^  revision (\d+)$', text, re.M)
          revision = int(old_revision.group(1)) if old_revision else 0
          if old_version != os.environ["TAG"]:
              revision = 0
          elif old_sha != os.environ["SHA256"]:
              revision += 1

          for field, value in (("version", os.environ["TAG"]),
                               ("url", os.environ["URL"]),
                               ("sha256", os.environ["SHA256"])):
              text, count = re.subn(rf'^  {field} .*$',
                                    lambda _: f'  {field} "{value}"', text, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {field} in {path}")
          text = re.sub(r'^  revision \d+\n', '', text, flags=re.M)
          if revision:
              text, count = re.subn(r'^(  license .*\n)',
                                    lambda m: f'{m.group(1)}  revision {revision}\n',
                                    text, flags=re.M)
              if count != 1:
                  raise SystemExit(f"Expected exactly one license in {path}")
          path.write_text(text)
          print(f"Updated {os.environ['TAG']}, revision {revision}")
          PY

      - name: Commit and push Formula update
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Formula/bBpiano-L.rb

          if git diff --cached --quiet; then
            echo "Formula is already up to date."
            exit 0
          fi

          git commit -m "Update bBpiano-L formula for ${TAG}"
          git push
