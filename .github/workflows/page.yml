name: GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - run: pip install mkdocs-material

      - run: python doc/site/build.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: ${{ env.PAGES_ARTIFACT }}

      - name: Wait for the uploaded artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq ".artifacts | map(select(.name == \"$PAGES_ARTIFACT\")) | length")
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 5
          done
          echo "The Pages artifact was not available after upload."
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
